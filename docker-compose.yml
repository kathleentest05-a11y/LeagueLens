services:
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_GRAPHQL_URL: ${NEXT_PUBLIC_GRAPHQL_URL:-http://localhost:4000/graphql}
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      NEXT_PUBLIC_GRAPHQL_URL: ${NEXT_PUBLIC_GRAPHQL_URL:-http://localhost:4000/graphql}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: npm run start:api -w @leaguelens/backend
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      DATABASE_URL: postgres://${POSTGRES_USER:-leaguelens}:${POSTGRES_PASSWORD:-leaguelens-local-only}@db:5432/${POSTGRES_DB:-leaguelens}
      WEB_ORIGIN: http://localhost:3000
      UPLOAD_DIR: /data/uploads
      # Optional Yahoo OAuth (post-M1, PRD Section 6.4); blank = Yahoo disabled.
      YAHOO_CLIENT_ID: ${YAHOO_CLIENT_ID:-}
      YAHOO_CLIENT_SECRET: ${YAHOO_CLIENT_SECRET:-}
      YAHOO_REDIRECT_URI: ${YAHOO_REDIRECT_URI:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: npm run start:worker -w @leaguelens/backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-leaguelens}:${POSTGRES_PASSWORD:-leaguelens-local-only}@db:5432/${POSTGRES_DB:-leaguelens}
      UPLOAD_DIR: /data/uploads
      # Optional Yahoo OAuth (post-M1, PRD Section 6.4); blank = Yahoo disabled.
      YAHOO_CLIENT_ID: ${YAHOO_CLIENT_ID:-}
      YAHOO_CLIENT_SECRET: ${YAHOO_CLIENT_SECRET:-}
      YAHOO_REDIRECT_URI: ${YAHOO_REDIRECT_URI:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-leaguelens}
      POSTGRES_USER: ${POSTGRES_USER:-leaguelens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leaguelens-local-only}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-leaguelens} -d $${POSTGRES_DB:-leaguelens}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    ports:
      - "6379:6379"

volumes:
  pgdata:
  uploads:
